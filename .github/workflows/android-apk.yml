name: orca-core-0.1 Android APK

on:
  push:
    branches: [orca-core-0.1]
    paths: ['android/**', 'src/**', 'include/**', 'CMakeLists.txt', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Also publish the APK as a GitHub prerelease (tag orca-core-0.1-apk-<commit>)'
        type: boolean
        default: false

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: Build the APK (arm64-v8a, release build signed with the debug key)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble
        env:
          # Optional repository secret: a key file (base64) whose values become OrcaIOSC's
          # built-in defaults (include/orca/ios/key_bundle.hpp). Only for values the owner
          # is entitled to; without it the APK has none.
          ORCA_DEFAULT_KEYS_B64: ${{ secrets.ORCA_DEFAULT_KEYS }}
        run: |
          export ORCA_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")
          if [ -n "$ORCA_DEFAULT_KEYS_B64" ]; then
            echo "$ORCA_DEFAULT_KEYS_B64" | base64 -d > "$RUNNER_TEMP/orca_default_keys"
            export ORCA_DEFAULT_KEYS_FILE="$RUNNER_TEMP/orca_default_keys"
            echo "ORCA_BUNDLED_KEYS=1" >> "$GITHUB_ENV"
            echo "Built-in default key values: from the ORCA_DEFAULT_KEYS secret"
          else
            echo "Built-in default key values: none"
          fi
          echo "NDK $ORCA_NDK_VERSION"
          cd android
          gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          ls -l "$apk"
          unzip -l "$apk" | tee contents.txt
          grep -q "lib/arm64-v8a/liborca_android.so" contents.txt
          unzip -o -q "$apk" lib/arm64-v8a/liborca_android.so -d apkcheck
          file apkcheck/lib/arm64-v8a/liborca_android.so | grep -q "ARM aarch64"
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$bt/apksigner" verify --print-certs "$apk"
          "$ANDROID_HOME/build-tools/$bt/aapt2" dump badging "$apk" | head -5
          # without the secret the generated bundle must be empty: no key value in the APK
          gen=$(find android/app/.cxx -name orca_key_bundle.cpp -path "*generated*" | head -1)
          if [ "$ORCA_BUNDLED_KEYS" != "1" ]; then
            test -n "$gen" && grep -q "kBundleSize = 0" "$gen"
            echo "Built-in key bundle: empty ($gen)"
          fi
          cp "$apk" "orca-core-0.1-${GITHUB_SHA::7}-arm64-v8a.apk"
          sha256sum orca-core-0.1-*.apk | tee orca-core-0.1-apk.sha256
      - uses: actions/upload-artifact@v4
        # an APK with built-in key values is never uploaded as an (downloadable) artifact
        if: env.ORCA_BUNDLED_KEYS != '1'
        with:
          name: orca-core-0.1-apk-${{ github.sha }}
          path: |
            orca-core-0.1-*.apk
            orca-core-0.1-apk.sha256
          if-no-files-found: error
      - name: Publish a prerelease (manual runs only)
        # never published publicly when the APK carries built-in key values
        if: github.event_name == 'workflow_dispatch' && inputs.prerelease && env.ORCA_BUNDLED_KEYS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="orca-core-0.1-apk-${GITHUB_SHA::7}"
          gh release create "$tag" orca-core-0.1-*.apk orca-core-0.1-apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Orca Core 0.1 — APK de prueba (${GITHUB_SHA::7})" \
            --notes "APK arm64-v8a (Android 8.0+), compilación release firmada con la clave de depuración del SDK: solo para pruebas, no para tiendas. No incluye BIOS, claves ni juegos. No se ha probado todavía en un teléfono real. Estado y límites: docs/ESTADO.md en la rama orca-core-0.1."
