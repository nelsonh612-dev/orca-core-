name: Orca Core ARM64 JIT validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S orca_core -B orca_core/build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DORCA_WERROR=ON -DORCA_BUILD_TESTS=ON -DORCA_GLES=OFF
      - name: Build
        run: cmake --build orca_core/build --parallel 2
      - name: Test
        run: ctest --test-dir orca_core/build --output-on-failure

  arm64-jit-qemu:
    name: Execute generated ARM64 JIT code under QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 cross compiler and QEMU
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-aarch64-linux-gnu qemu-user
      - name: Create AArch64 toolchain file
        run: |
          cat > "$RUNNER_TEMP/aarch64-toolchain.cmake" <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF
      - name: Configure AArch64 tests
        run: cmake -S orca_core -B orca_core/build-aarch64 -G Ninja -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/aarch64-toolchain.cmake" -DORCA_BUILD_TESTS=ON -DORCA_GLES=OFF -DORCA_WERROR=ON
      - name: Build JIT differential tests and benchmark
        run: cmake --build orca_core/build-aarch64 --target orca_test_jit_arm64 orca_bench_interpreter --parallel 2
      - name: Execute generated AArch64 machine code
        run: qemu-aarch64 -L /usr/aarch64-linux-gnu orca_core/build-aarch64/orca_test_jit_arm64
      - name: Smoke-test interpreter versus JIT benchmark under QEMU
        run: qemu-aarch64 -L /usr/aarch64-linux-gnu orca_core/build-aarch64/orca_bench_interpreter 10000 i compare

  android-arm64:
    name: Android ARM64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android toolchains
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble ARM64 debug APK
        run: gradle -p orca_core/android :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orca-core-m026-android-arm64-debug
          path: orca_core/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build standalone Android ARM64 benchmark runner
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_DIR="$SDK_DIR/ndk/27.2.12479018"
          cmake -S orca_core -B orca_core/build-android-bench \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DORCA_BUILD_TESTS=OFF -DORCA_GLES=OFF -DORCA_WERROR=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build orca_core/build-android-bench --target orca_bench_interpreter --parallel 2
          file orca_core/build-android-bench/orca_bench_interpreter
      - name: Upload ARM64 benchmark runner
        uses: actions/upload-artifact@v4
        with:
          name: orca-core-arm64-benchmark-runner
          path: orca_core/build-android-bench/orca_bench_interpreter
          if-no-files-found: error
