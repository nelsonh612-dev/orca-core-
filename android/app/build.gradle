plugins {
    id 'com.android.application'
}

android {
    namespace 'org.orca.emu'
    compileSdk 34
    ndkVersion System.getenv('ORCA_NDK_VERSION') ?: '27.2.12479018'

    defaultConfig {
        applicationId 'org.orca.emu'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // OrcaIOSC's built-in default values (include/orca/ios/key_bundle.hpp): a key file
                // given by the builder through ORCA_DEFAULT_KEYS_FILE; none by default.
                arguments '-DANDROID_STL=c++_static', "-DORCA_DEFAULT_KEYS_FILE=${System.getenv('ORCA_DEFAULT_KEYS_FILE') ?: ''}"
                cppFlags '-std=c++20'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Test builds: optimised native code, signed with the SDK's debug key so the APK installs
            // directly. Not for store distribution (that needs the owner's own release key).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
